# Alembic configuration.
# The actual database URL is injected at runtime from the DATABASE_URL env var
# inside migrations/env.py — the value below is a non-functional placeholder so
# alembic.ini never contains credentials and works for both api and worker images.

[alembic]
script_location = migrations

# Use a path-aware template so revision files sort chronologically.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = src
path_separator = os

# Placeholder only. Overridden in env.py via os.environ["DATABASE_URL"].
sqlalchemy.url = driver://placeholder:placeholder@localhost/placeholder

[post_write_hooks]
# Auto-format generated migrations with ruff.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
